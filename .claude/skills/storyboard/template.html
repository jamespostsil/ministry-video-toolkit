<title>__TITLE__</title>
<style>
/* Storyboard: one card per script line, the real picture of what is on screen beside what is said. The wording can
   be edited in place; Script and On-screen notes per line; one Approve button for the whole draft. Saves to db. */
:root{--bg:#f6f5f2;--panel:#fff;--fg:#1e1d1b;--muted:#5f5b55;--faint:#8a857d;--line:#dcd8d0;--accent:__ACCENT__;--accent-fg:#fff;--field:#fbfaf8;--chg:#2f5f74;--ok:#2e6b3f;--ui:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--panel:#1e1c1a;--fg:#ebe8e3;--muted:#aaa49b;--faint:#857f76;--line:#36332f;--accent-fg:#151412;--field:#191816;--chg:#9cc7da;--ok:#8fd19e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151412;--panel:#1e1c1a;--fg:#ebe8e3;--muted:#aaa49b;--faint:#857f76;--line:#36332f;--accent-fg:#151412;--field:#191816;--chg:#9cc7da;--ok:#8fd19e;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--ui);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto;display:grid;gap:14px}
header{padding-block:18px 0;display:grid;gap:4px}
h1{margin:0;font-size:1.45rem;text-wrap:balance}
h2.sec{margin:10px 0 0;font-size:1rem;color:var(--muted)}
.muted{color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.state{flex:1 1 220px;font-weight:600}.state.ok{color:var(--ok)}
.btn{font:600 .9rem var(--ui);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);overflow:hidden}
.card.changed{box-shadow:inset 4px 0 0 var(--chg)}
.pic{background:var(--bg);display:grid;align-content:start;gap:6px;padding:10px;border-right:1px solid var(--line);min-width:0}
.pic img{width:100%;border-radius:4px;display:block;border:1px solid var(--line);cursor:zoom-in}
.pic .none{font-size:.88rem;color:var(--faint);padding:20px 0;text-align:center}
.pic .cap{font-size:.88rem;color:var(--muted)}
.body{padding:10px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.n{font:600 .78rem ui-monospace,Consolas,monospace;color:var(--faint)}
textarea{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical;field-sizing:content;min-height:2.3em}
textarea.say{font-size:1.02rem;font-weight:600;background:transparent;border-color:transparent}
textarea.say:hover,textarea.say:focus{border-color:var(--line);background:var(--field)}
.was{font-size:.84rem;color:var(--muted)}
.lab{font:700 .7rem var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.meta{font-size:.78rem;color:var(--muted);min-height:1em}
dialog{border:0;padding:0;background:transparent;max-width:96vw}
dialog img{max-width:96vw;max-height:90vh;display:block;border-radius:6px}
dialog::backdrop{background:rgb(0 0 0/.75)}
@media (max-width:760px){.card{grid-template-columns:1fr}.pic{border-right:0;border-bottom:1px solid var(--line)}.notes{grid-template-columns:1fr}}
</style>
<main>
<header><h1>__TITLE__</h1><p class="muted" id="intro"></p></header>
<div class="bar"><span class="state" id="state">Connecting&hellip;</span><button type="button" class="btn primary" id="approve">Approve this draft</button></div>
<div id="list"></div>
<section class="card" style="grid-template-columns:1fr"><div class="body"><span class="lab">Anything else</span><textarea id="general" aria-label="Notes about the whole storyboard"></textarea><span class="meta" id="s-gen"></span></div></section>
</main>
<dialog id="zoom"><img alt=""></dialog>
<script>
const D = __DATA__;
const $ = (id) => document.getElementById(id), V = D.draft;
$("intro").textContent = D.intro || "Each line: what is said, and a picture of what is on screen. Edit any wording in place; notes save as you type. Nothing is recorded or voiced until you approve.";
const cards = {};
let last = null;
for (const r of D.lines) {
  if (r.section && r.section !== last) { const h = document.createElement("h2"); h.className = "sec"; h.textContent = r.section; $("list").appendChild(h); last = r.section; }
  const c = document.createElement("article"); c.className = "card" + (r.was ? " changed" : ""); c.style.marginBottom = "10px";
  c.innerHTML = '<div class="pic"></div><div class="body"><span class="n"></span><textarea class="say"></textarea><div class="was" hidden></div>' +
    '<div class="notes"><div><span class="lab">Script</span><textarea data-f="script" placeholder="Wording, voice"></textarea></div>' +
    '<div><span class="lab">On screen</span><textarea data-f="screen" placeholder="Pictures, graphics, timing"></textarea></div></div><span class="meta"></span></div>';
  const pic = c.querySelector(".pic");
  if (r.image) { const im = document.createElement("img"); im.src = r.image; im.alt = r.screen || ""; im.loading = "lazy"; im.onclick = () => { $("zoom").querySelector("img").src = r.image; $("zoom").showModal(); }; pic.appendChild(im); }
  else { const n = document.createElement("div"); n.className = "none"; n.textContent = "No picture yet"; pic.appendChild(n); }
  if (r.screen) { const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = r.screen; pic.appendChild(cap); }
  c.querySelector(".n").textContent = "Line " + r.n;
  const say = c.querySelector(".say"); say.value = r.text; say.setAttribute("aria-label", "Wording of line " + r.n);
  if (r.was) { const w = c.querySelector(".was"); w.hidden = false; w.textContent = "Before: " + r.was; }
  $("list").appendChild(c); cards[r.n] = { r, c, say };
}
$("zoom").onclick = () => $("zoom").close();
(async () => {
  const db = await claude.use("db");
  if (!db) { $("state").textContent = "Can't save in this view: open the published link while signed in."; return; }
  const col = db.collection("lines-" + V), meta = db.collection("draft-" + V), timers = new Map();
  const save = (x) => { const m = x.c.querySelector(".meta"); m.textContent = "…"; clearTimeout(timers.get(x)); timers.set(x, setTimeout(async () => {
    const t = x.say.value.trim(), notes = {}; x.c.querySelectorAll("[data-f]").forEach((ta) => notes[ta.dataset.f] = ta.value);
    try { await col.doc(String(x.r.n)).set({ text: t === x.r.text ? "" : t, original: x.r.text, ...notes }); m.textContent = "saved"; } catch (e) { m.textContent = "not saved"; } }, 700)); };
  for (const x of Object.values(cards)) x.c.querySelectorAll("textarea").forEach((ta) => ta.addEventListener("input", () => save(x)));
  let gt = null; $("general").addEventListener("input", () => { $("s-gen").textContent = "…"; clearTimeout(gt); gt = setTimeout(async () => {
    try { await meta.doc("general").set({ text: $("general").value }); $("s-gen").textContent = "saved"; } catch (e) { $("s-gen").textContent = "not saved"; } }, 700); });
  const show = (a) => { const s = $("state");
    if (a && a.approved) { s.textContent = "Approved " + new Date(a.at).toLocaleString() + "."; s.className = "state ok"; $("approve").textContent = "Withdraw approval"; }
    else { s.textContent = "Not approved yet."; s.className = "state"; $("approve").textContent = "Approve this draft"; }
    $("approve").dataset.on = a && a.approved ? "1" : ""; };
  $("approve").onclick = async () => { const a = { approved: !$("approve").dataset.on, at: new Date().toISOString() };
    try { await meta.doc("approval").set(a); show(a); } catch (e) { $("state").textContent = "Couldn't save. Try again."; } };
  col.onSnapshot((snap) => { for (const d of snap.docs) { const x = cards[d.id], v = d.data() || {}; if (!x) continue;
    if (v.text && document.activeElement !== x.say) x.say.value = v.text;
    x.c.querySelectorAll("[data-f]").forEach((ta) => { if (document.activeElement !== ta) ta.value = v[ta.dataset.f] || ""; }); } });
  meta.onSnapshot((snap) => { let a = null; for (const d of snap.docs) { if (d.id === "approval") a = d.data(); if (d.id === "general" && document.activeElement !== $("general")) $("general").value = (d.data() || {}).text || ""; } show(a); });
})().catch(() => { $("state").textContent = "Can't save in this view."; });
</script>
